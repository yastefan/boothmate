# grandMA3 2.5 (verified on onPC 2.5.1.1, macOS; see docs/spikes/m0-feedback.md).
name = "grandMA3 2.5"
versions = ["2.5"]

# OSC output addresses (OSC line with Send = Yes). {n} is the pool or master number.
# They name the object, not the executor; the manual's /13.13.1.6.X is outdated.
[osc]
sequence = "/14.14.1.7.{n}"
# Any other /14.13.<category>.<n> (ShowData.Masters) is shown as "Master <category>.<n>".
master_prefix = "/14.13."

[[osc.master]]
address = "/14.14.1.6.{n}"
label = "Group {n}"

[[osc.master]]
address = "/14.13.2.{n}"
label = "Grand"

[[osc.master]]
address = "/14.13.3.{n}"
label = "Speed {n}"

# OSC input to grandMA3 (second OSC line, Receive = Yes). {page} and {exec} are replaced.
# From the grandMA3 manual ("OSC" remote inputs); FaderRange on the OSC line must match.
[osc.input]
key = "/Page{page}/Key{exec}"         # int 1 = press, 0 = release
fader = "/Page{page}/Fader{exec}"     # float 0 .. fader_range
encoder = "/Page{page}/Encoder{exec}" # float, percent to move, negative = down
fader_range = 100.0
