# grandMA3 2.5 (verified on onPC 2.5.1.1, macOS; see docs/spikes/m0-feedback.md).
name = "grandMA3 2.5"
versions = ["2.5"]

# OSC output addresses (OSC line with Send = Yes). {n} is the pool number.
# They name the object, not the executor; the manual's /13.13.1.6.X is outdated.
[osc]
sequence = "/14.14.1.7.{n}"
group_master = "/14.14.1.6.{n}"
grand_master = "/14.13.2.1"
