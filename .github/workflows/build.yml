name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings

  package:
    needs: test
    strategy:
      matrix:
        include:
          - os: macos-latest
            name: mac
          - os: windows-latest
            name: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build (macOS universal)
        if: matrix.name == 'mac'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin
          mkdir -p Boothmate
          lipo -create -output Boothmate/boothmate-mac \
            target/aarch64-apple-darwin/release/boothmate target/x86_64-apple-darwin/release/boothmate
      - name: Build (Windows)
        if: matrix.name == 'win'
        shell: bash
        run: |
          cargo build --locked --release
          mkdir -p Boothmate
          cp target/release/boothmate.exe Boothmate/boothmate-win.exe
      - name: Portable folder
        shell: bash
        run: cp -r ma-profiles lua README.md LICENSE Boothmate/
      # Zipped here so the macOS binary keeps its executable bit.
      - name: Zip
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = win ]; then 7z a Boothmate-win.zip Boothmate; else zip -r Boothmate-mac.zip Boothmate; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Boothmate-${{ matrix.name }}
          path: Boothmate-${{ matrix.name }}.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: Boothmate-${{ matrix.name }}.zip
